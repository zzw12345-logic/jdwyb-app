name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install
      working-directory: ./jdwyb-app-github

    - name: Sync Capacitor
      run: npx cap sync android
      working-directory: ./jdwyb-app-github

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      working-directory: ./jdwyb-app-github

    - name: Build APK
      run: |
        cd android
        ./gradlew assembleDebug
      working-directory: ./jdwyb-app-github

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: jdwyb-app-debug
        path: jdwyb-app-github/android/app/build/outputs/apk/debug/app-debug.apk
